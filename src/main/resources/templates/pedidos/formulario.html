<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulário de Pedido</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">
    <h1 th:text="${pedido.id != null ? 'Editar Pedido' : 'Novo Pedido'}"></h1>
    <form method="post" th:action="@{/pedidos}" th:object="${pedido}">
        <div class="form-group">
            <label for="cliente">Cliente</label>
            <input class="form-control" id="cliente" name="cliente" required th:value="${pedido.cliente.nome}"
                   type="text">
        </div>
        <div class="form-group">
            <label for="status">Status</label>
            <input class="form-control" id="status" name="status" required th:value="${pedido.status}" type="text">
        </div>
        <button class="btn btn-primary mt-3" type="submit">Salvar</button>
    </form>
</div>
</body>
</html>
