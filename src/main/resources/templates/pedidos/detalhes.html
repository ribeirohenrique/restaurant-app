<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalhes do Pedido</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">
    <h1>Detalhes do Pedido</h1>
    <p><strong>ID:</strong> <span th:text="${pedido.id}">1</span></p>
    <p><strong>Cliente:</strong> <span th:text="${pedido.cliente.nome}">Cliente Nome</span></p>
    <p><strong>Status:</strong> <span th:text="${pedido.status}">PENDENTE</span></p>
    <a class="btn btn-secondary" href="/pedidos">Voltar</a>
</div>
</body>
</html>
