<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro de Produto</title>
</head>
<body>
<h1>Cadastro de Produto</h1>
<form action="/produtos/salvar" th:object="${produto}" method="post">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" th:field="*{nome}" />

    <label for="descricao">Descrição:</label>
    <textarea id="descricao" name="descricao" th:field="*{descricao}"></textarea>

    <label for="preco">Preço:</label>
    <input type="number" step="0.01" id="preco" name="preco" th:field="*{preco}" />

    <button type="submit">Salvar</button>
</form>
<a href="/produtos">Voltar para o Cardápio</a>
</body>
</html>
