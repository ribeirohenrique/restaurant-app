<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulário de Restaurante</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">
    <h1 th:text="${restaurante.id != null ? 'Editar Restaurante' : 'Novo Restaurante'}"></h1>
    <form method="post" th:action="@{/restaurantes}" th:object="${restaurante}">
        <div class="form-group">
            <label for="nome">Nome</label>
            <input class="form-control" id="nome" name="nome" required th:value="${restaurante.nome}" type="text">
        </div>
        <div class="form-group">
            <label for="endereco">Endereço</label>
            <input class="form-control" id="endereco" name="endereco" required th:value="${restaurante.endereco}"
                   type="text">
        </div>
        <div class="form-group">
            <label for="telefone">Telefone</label>
            <input class="form-control" id="telefone" name="telefone" required th:value="${restaurante.telefone}"
                   type="text">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input class="form-control" id="email" name="email" required th:value="${restaurante.email}" type="email">
        </div>
        <div class="form-group">
            <button class="btn btn-success" type="submit">Salvar</button>
            <a class="btn btn-secondary" href="/restaurantes">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
