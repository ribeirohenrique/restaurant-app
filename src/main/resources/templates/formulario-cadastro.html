<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro de Produtos</title>
</head>
<body>
<h1>Cadastro de Produtos</h1>

<form th:action="@{/item-cardapio}" th:object="${itemCardapio}" method="post">
    <!-- Nome -->
    <label for="nome">Nome do Produto:</label>
    <input type="text" id="nome" name="nome" th:field="*{nome}" required />

    <!-- Descrição -->
    <label for="descricao">Descrição:</label>
    <textarea id="descricao" name="descricao" th:field="*{descricao}" required></textarea>

    <!-- Preço -->
    <label for="preco">Preço:</label>
    <input type="number" id="preco" name="preco" th:field="*{preco}" step="0.01" required />

    <!-- Botão de Enviar -->
    <button type="submit">Salvar</button>
</form>

<a href="/item-cardapio/listar">Voltar para a lista</a>
</body>
</html>
