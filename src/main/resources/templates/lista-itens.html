<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Itens do Cardápio</title>
</head>
<body>
    <h1>Itens do Cardápio</h1>

    <!-- Tabela para exibir os itens -->
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Descrição</th>
                <th>Preço</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <!-- Iterar sobre os itens do cardápio -->
            <tr th:each="item : ${itens}">
                <td th:text="${item.id}">ID</td>
                <td th:text="${item.nome}">Nome</td>
                <td th:text="${item.descricao}">Descrição</td>
                <td th:text="${item.preco}">Preço</td>
                <td>
                    <a th:href="@{/item-cardapio/editar/{id}(id=${item.id})}">Editar</a> |
                    <a th:href="@{/item-cardapio/deletar/{id}(id=${item.id})}">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Botão para adicionar novo item -->
    <a href="/item-cardapio/cadastrar">
        <button>Cadastrar Novo Item</button>
    </a>
</body>
</html>
