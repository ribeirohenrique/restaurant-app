<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalhes do Endereço</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">
    <h1>Detalhes do Endereço</h1>
    <p><strong>ID:</strong> <span th:text="${endereco.id}">1</span></p>
    <p><strong>Rua:</strong> <span th:text="${endereco.rua}">Rua Exemplo</span></p>
    <p><strong>Número:</strong> <span th:text="${endereco.numero}">123</span></p>
    <a class="btn btn-secondary" href="/enderecos-restaurantes">Voltar</a>
</div>
</body>
</html>
