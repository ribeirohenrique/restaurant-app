<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Endereços</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">
    <h1>Endereços dos Restaurantes</h1>
    <a class="btn btn-primary mb-3" href="/enderecos-restaurantes/novo">Adicionar Novo Endereço</a>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Rua</th>
            <th>Número</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="endereco : ${enderecos}">
            <td th:text="${endereco.id}">1</td>
            <td th:text="${endereco.rua}">Rua Exemplo</td>
            <td th:text="${endereco.numero}">123</td>
            <td>
                <a class="btn btn-info" th:href="@{/enderecos-restaurantes/{id}(id=${endereco.id})}">Detalhes</a>
                <a class="btn btn-warning"
                   th:href="@{/enderecos-restaurantes/editar/{id}(id=${endereco.id})}">Editar</a>
                <a class="btn btn-danger"
                   th:href="@{/enderecos-restaurantes/deletar/{id}(id=${endereco.id})}">Deletar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
