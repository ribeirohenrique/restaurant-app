<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulário de Endereço</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container">
    <h1 th:text="${endereco.id != null ? 'Editar Endereço' : 'Novo Endereço'}"></h1>
    <form method="post" th:action="@{/enderecos-restaurantes}" th:object="${endereco}">
        <div class="form-group">
            <label for="rua">Rua</label>
            <input class="form-control" id="rua" name="rua" required th:value="${endereco.rua}" type="text">
        </div>
        <div class="form-group">
            <label for="numero">Número</label>
            <input class="form-control" id="numero" name="numero" required th:value="${endereco.numero}" type="text">
        </div>
        <button class="btn btn-primary mt-3" type="submit">Salvar</button>
    </form>
</div>
</body>
</html>
